description:
  it:
    localisedName: "CheCaldo!"
    genericName: "Prioritizzazione di contatti in ondata di calore"
    shortDescription: >-
      Ogni mattina d'estate risponde a una domanda: durante un'ondata di
      calore, chi contattare per primo tra gli assistiti anziani.
    longDescription: |
      CheCaldo! è un'applicazione web self-hosted per organizzazioni
      (Comuni, ASL, associazioni di volontariato) che gestiscono liste di
      persone anziane o fragili e devono decidere l'ordine di contatto
      durante le ondate di calore.

      Incrocia tre fonti pubbliche:

      - il livello di allerta del giorno (bollettino del Ministero della
        Salute via onData per le 27 città coperte; stima basata su
        Open-Meteo e climatologia locale per tutti gli altri comuni);
      - il profilo strutturale del quartiere ricavato dalle Basi
        territoriali ISTAT 2021 (persone per famiglia, densità edilizia,
        distanza dai parchi urbani);
      - la lista degli assistiti che l'organizzazione carica dalla
        propria anagrafe (import CSV/Excel con adattatore di colonne).

      Un'organizzazione serve un comune. Una stessa istanza può
      ospitare più organizzazioni, ciascuna titolare dei propri dati
      e isolata dalle altre a livello di schema e di query. L'app
      include una pagina pubblica informativa (con mappa, livello di
      allerta e consigli sui punti freschi vicini), una dashboard
      riservata al coordinatore, e una vista mobile per il volontario
      in giro.

      Non sostituisce i canali istituzionali di soccorso e
      segnalazione: a Parma esiste il Piano Caldo del Comune con
      segreteria h24 (0521.218444), attivo fino al 15 settembre.

      Il motore di punteggio, il poller del bollettino, il calcolo delle
      distanze e le motivazioni per gli assegnati sono
      **deterministici** — niente modelli di linguaggio dove
      l'affidabilità conta. L'LLM interviene solo su tre blocchi di
      testo, tutti con fallback: due sulla pagina pubblica (consulente
      del quartiere, frase sull'allerta della città) e uno sulla
      dashboard del coordinatore (riassunto della giornata).
    features:
      - "Motore di punteggio deterministico su ranghi percentili"
      - "Livello di allerta ufficiale (bollettino ministeriale) o stimato"
      - "Backtest del metodo di stima misurato per orizzonte (24/48/72h)"
      - "Coropleta della città a livello di sezione ISTAT (vector tiles PostGIS)"
      - "Punti freschi mappati (biblioteche, farmacie, casette Iren, fontanelle, parchi)"
      - "Vista volontario mobile con script ed escalation"
      - "Dashboard coordinatore con classifica, coda sintomi, banda soglia"
      - "Adattatore di colonne CSV/Excel per l'import dell'anagrafe da riga di comando"
      - "Senza JavaScript restano leggibili livello di allerta, raccomandazioni, profilo del quartiere e testo dell'agente; mappa e elenco filtrabile dei punti freschi richiedono JS"
      - "Contrasto WCAG AA verificato, area toccabile ≥44 px (WCAG 2.5.5), markup semantico con aria-label e sr-only per etichette non visive"

